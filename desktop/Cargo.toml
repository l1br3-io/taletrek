[package]
name = "taletrek-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "TaleTrek desktop synth CLI — off-device Piper synthesis for .taletrek bundles."

[[bin]]
name = "taletrek-desktop"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
ureq = "3"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
