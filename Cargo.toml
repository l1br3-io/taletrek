[workspace]
resolver = "2"
members = ["crates/*", "desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["l1br3"]
repository = "https://github.com/l1br3/taletrek"
description = "TaleTrek — free, open-source reading companion. By l1br3."

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Noise for an internal workspace crate (not published; transitive deps).
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
