<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaleTrek spike — Piper TTS</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; padding: 24px; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        background: #0b1120; color: #e5e7eb; max-width: 720px;
      }
      h1 { font-size: 18px; }
      textarea { width: 100%; min-height: 60px; box-sizing: border-box; background:#111827; color:#e5e7eb; border:1px solid #1f2937; border-radius:6px; padding:8px; }
      button { background:#22c55e; color:#022; border:0; border-radius:6px; padding:8px 14px; font-weight:600; cursor:pointer; }
      button:disabled { opacity:.5; cursor:default; }
      select, option { background:#111827; color:#e5e7eb; }
      pre { background:#111827; border:1px solid #1f2937; border-radius:6px; padding:10px; white-space:pre-wrap; max-height:240px; overflow:auto; }
      .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
      .muted { color:#9ca3af; font-size:12px; }
    </style>
  </head>
  <body>
    <h1>TaleTrek spike — Piper TTS (on-device, WASM)</h1>
    <div class="row">
      <label>Voice: <select id="voice"></select></label>
      <button id="download">Download model</button>
    </div>
    <textarea id="text">The quick brown fox jumps over the lazy dog. TaleTrek turns any ebook into an audiobook you can listen to anywhere.</textarea>
    <div class="row">
      <button id="synth">Synthesize</button>
      <span id="status" class="muted">idle</span>
    </div>
    <audio id="audio" controls style="width:100%"></audio>
    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
