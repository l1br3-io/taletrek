# UniFFI global config (new-style [crates.<name>] sections) — passed to
# `uniffi-bindgen generate --config` by `just android-bindings`. The
# Kotlin package matches the app's package root so the generated file
# sits inside the hand-written sources it serves.
[crates.taletrek_ffi.bindings.kotlin]
package_name = "dev.l1br3.taletrek.ffi"
cdylib_name = "taletrek_ffi"
