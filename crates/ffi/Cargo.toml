[package]
name = "taletrek-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "TaleTrek UniFFI surface — the kernel's foreign-language API (Kotlin now, Swift next). By l1br3."

# cdylib so `uniffi-bindgen generate --library` can read the proc-macro
# metadata from the host-built artifact (`just android-bindings`); lib so
# the workspace, tests, and clippy consume it like every other crate.
[lib]
name = "taletrek_ffi"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
taletrek-reader = { path = "../reader" }
# Full pipeline surface (android-pipeline task 001): parse + worker + the
# in-process engines. sherpa links a prebuilt shared libsherpa-onnx-c-api.so
# + libonnxruntime.so on Android (static on desktop hosts) — the justfile's
# android-kernel recipe copies them into jniLibs after the build. native-encode
# vendors libopus via cmake (needs the NDK toolchain env cargo-ndk provides).
taletrek-synth = { path = "../synth", features = ["sherpa", "native-encode"] }
taletrek-parse = { path = "../parse" }
taletrek-worker = { path = "../worker" }
uniffi = "0.32"

[lints]
workspace = true
