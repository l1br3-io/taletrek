[package]
name = "taletrek-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "TaleTrek host-level synth worker — voice acquire + (later) parallel pool + stamping. By l1br3."

[lib]
name = "taletrek_worker"
path = "src/lib.rs"

[features]
# Forwarded to taletrek-synth: enables the real sherpa runner for the
# `#[ignore]`d full-pipeline e2e fixture (mirrors the desktop's feature).
sherpa = ["taletrek-synth/sherpa"]

[dependencies]
ureq = "3"
dirs = "6"
thiserror = "2"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
taletrek-synth = { path = "../synth" }
taletrek-parse = { path = "../parse" }

[dev-dependencies]
tempfile = "3"
taletrek-memtrack = { path = "../memtrack" }

[lints]
workspace = true
