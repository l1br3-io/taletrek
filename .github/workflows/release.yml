# Release builds — tag `v*` → per-target artifacts (spec: desktop-synth-gui).
#
# Hand-rolled on purpose: no cargo-dist scaffolding. One job, a target matrix,
# the binary the workspace already produces.
#
#   x86_64-unknown-linux-gnu  first-class — smoke-tested before upload
#   aarch64-linux / windows / macos  best-effort (continue-on-error) —
#     informed by the T1/T2 spikes: sherpa-onnx statically links its prebuilt
#     per-platform archive (no cmake/libclang), the `opus` crate's bundled
#     libopus needs cmake + a C compiler, and cpal's alsa-sys needs
#     libasound2-dev (arm64 multiarch for the aarch64 cross).
#
# Dry runs: workflow_dispatch on any branch — same build + smoke + artifact
# upload, but no GitHub release is created (tag pushes only). See
# docs/releasing.md.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run — no release, artifacts stay on the run

permissions:
  contents: write # attach artifacts to the tag's GitHub release

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # glibc (gnu) Linux target: the spikes proved onnxruntime + espeak-ng +
    # piper_phonemize + libopus all statically link under gnu, leaving only
    # baseline system libs dynamic — musl would buy nothing and risk the
    # k2-fsa prebuilt link. Recorded in the desktop-synth-gui release-workflow
    # commit (git log --grep desktop-synth-gui).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            bin_ext: ''
            best_effort: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest # cross-compiled from x86_64
            archive: tar.gz
            bin_ext: ''
            best_effort: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin_ext: '.exe'
            best_effort: true
          - target: aarch64-apple-darwin
            os: macos-latest # arm64 runner — native build
            archive: tar.gz
            bin_ext: ''
            best_effort: true
    continue-on-error: ${{ matrix.best_effort }}

    # Cross-link config for the aarch64-linux entry (no-ops elsewhere: the
    # env keys are target-specific). sherpa's prebuilt archive is C++; the
    # bundled libopus is cmake-built C — both need the cross toolchain.
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          # cmake: bundled libopus (T2); libasound2-dev: cpal/alsa-sys (reader T1);
          # sherpa needs nothing (T1).
          pkgs='cmake libasound2-dev'
          if [ "${{ matrix.target }}" = 'aarch64-unknown-linux-gnu' ]; then
            pkgs="$pkgs gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
            # alsa-sys cross-links against arm64 libasound: enable multiarch,
            # install the :arm64 headers/lib, and point pkg-config at the arm64
            # pc dir for later steps (Build). PKG_CONFIG_LIBDIR replaces the
            # whole search path, so it is exported ONLY on the cross entry.
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y libasound2-dev:arm64
            echo 'PKG_CONFIG_ALLOW_CROSS=1' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig' >> "$GITHUB_ENV"
          fi
          sudo apt-get update && sudo apt-get install -y $pkgs

      - name: Build (release, default features = native engines)
        run: cargo build --release --locked -p taletrek-desktop --target '${{ matrix.target }}'

      # Prove the artifact works before it is shipped: version + a real parse
      # (text-only path — no voice, no audio, no display). Linux first-class
      # only; the other targets have no smoke coverage (best-effort, per spec).
      - name: Smoke (headless)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          bin="target/${{ matrix.target }}/release/taletrek-desktop"
          "$bin" --version
          out="$(mktemp -d)/plain.taletrek"
          "$bin" parse --input crates/parse/testdata/plain.txt --output "$out"
          test -s "$out" && echo "smoke OK: $(wc -c < "$out") bytes"

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi

      - name: Package
        run: |
          stage="dist/taletrek-${VERSION}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/taletrek-desktop${{ matrix.bin_ext }}" "$stage/"
          name="taletrek-${VERSION}-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = 'zip' ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$stage' -DestinationPath 'dist/${name}.zip'"
          else
            tar -czf "dist/${name}.tar.gz" -C dist "taletrek-${VERSION}-${{ matrix.target }}"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: taletrek-${{ env.VERSION }}-${{ matrix.target }}
          path: dist/taletrek-*-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

      - name: Attach to the GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/taletrek-*-${{ matrix.target }}.${{ matrix.archive }}

  # Android player app — signed AAB (store-ready later) + signed universal
  # APK (side-load friendly) on tag pushes. Dry runs (workflow_dispatch)
  # build UNSIGNED artifacts and attach them to the run only, never a
  # release (the existing convention). The keystore never lives in the
  # repo — creation + the four secret names are documented in
  # docs/releasing.md § Android (ask-first before wiring secrets).
  android:
    name: android (aab + universal apk)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install pinned Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null

      - name: Install cargo-ndk (pinned)
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Cross-build the kernel (.so for both ABIs → jniLibs)
        run: just android-kernel

      - name: Decode the release keystore (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: printf '%s' "${{ secrets.TALETREK_ANDROID_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi

      # The signing env is present only on tag pushes; without it Gradle
      # builds unsigned outputs (the dry-run path — same commands).
      - name: Bundle + assemble (release)
        run: |
          if [ -f "$RUNNER_TEMP/release.jks" ]; then
            export TALETREK_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            export TALETREK_ANDROID_KEYSTORE_PASSWORD="${{ secrets.TALETREK_ANDROID_KEYSTORE_PASSWORD }}"
            export TALETREK_ANDROID_KEY_ALIAS="${{ secrets.TALETREK_ANDROID_KEY_ALIAS }}"
            export TALETREK_ANDROID_KEY_PASSWORD="${{ secrets.TALETREK_ANDROID_KEY_PASSWORD }}"
          fi
          android/gradlew --project-dir android bundleRelease assembleRelease

      - name: Package
        run: |
          mkdir -p dist
          apk="$(ls android/app/build/outputs/apk/release/*.apk)"
          aab="$(ls android/app/build/outputs/bundle/release/*.aab)"
          cp "$apk" "dist/taletrek-${VERSION}-android-universal.apk"
          cp "$aab" "dist/taletrek-${VERSION}-android.aab"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: taletrek-${{ env.VERSION }}-android
          path: |
            dist/taletrek-${{ env.VERSION }}-android-universal.apk
            dist/taletrek-${{ env.VERSION }}-android.aab
          if-no-files-found: error

      - name: Attach to the GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/taletrek-${{ env.VERSION }}-android-universal.apk
            dist/taletrek-${{ env.VERSION }}-android.aab

  # iOS player app — signed IPA on tag pushes (macos-15 to match the CI
  # ios job's Xcode pin; kernel via `just ios-kernel`, then xcodebuild
  # archive + exportArchive). Dry runs (workflow_dispatch) archive
  # UNSIGNED and attach the .xcarchive to the run only. The Apple
  # Distribution cert (.p12) + provisioning profile live as GitHub
  # secrets, base64-decoded into a throwaway keychain — never in the
  # repo. Secret names + creation steps: docs/releasing.md § iOS
  # (ask-first before wiring; the signed leg needs that session).
  ios:
    name: ios (signed ipa)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-release

      - name: Install just (not on the macOS image)
        run: brew install just

      - name: Cross-build the kernel (.a for both targets + xcframework → Vendor/)
        run: just ios-kernel

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi

      # Tag pushes only: import the distribution cert into a throwaway
      # keychain and install the profile where xcodebuild finds it.
      - name: Prepare signing identities (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_P12: ${{ secrets.TALETREK_IOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.TALETREK_IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.TALETREK_IOS_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$CERT_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$CERT_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
          # ExportOptions carries a placeholder; the team id arrives here.
          sed "s/__TEAM_ID__/${{ secrets.TALETREK_IOS_TEAM_ID }}/" \
            ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      # Tags: the real thing — device destination + the distribution team.
      # Dry runs: the SIMULATOR destination + an ad-hoc identity. No device
      # dry-run recipe survives both Xcode generations this job can meet:
      # CODE_SIGNING_ALLOWED=NO archives without producing the .xcarchive
      # on Xcode 16 (run 35680114365), while CODE_SIGN_IDENTITY=- dies at
      # build planning on Xcode 27 ("entitlements that require signing with
      # a development certificate" — even with zero entitlements). The
      # simulator archive needs no identities on any Xcode and yields the
      # real .xcarchive shape; proven locally 2026-10-02 (task 012's
      # no-dispatch Mac verification).
      - name: Archive (device + team on tags; simulator + ad-hoc on dry runs)
        run: |
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            xcodebuild -project ios/TaleTrek.xcodeproj -scheme TaleTrek \
              -destination 'generic/platform=iOS' \
              -archivePath build/TaleTrek.xcarchive archive \
              DEVELOPMENT_TEAM='${{ secrets.TALETREK_IOS_TEAM_ID }}'
          else
            xcodebuild -project ios/TaleTrek.xcodeproj -scheme TaleTrek \
              -destination 'generic/platform=iOS Simulator' \
              -archivePath build/TaleTrek.xcarchive archive CODE_SIGN_IDENTITY=-
          fi

      - name: Export the signed IPA (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          xcodebuild -exportArchive -archivePath build/TaleTrek.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath dist
          mv dist/TaleTrek.ipa "dist/taletrek-${VERSION}-ios.ipa"
          ls -la dist/

      - name: Package (dry run — the unsigned archive)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p dist
          cd build && zip -qry "../dist/taletrek-${VERSION}-ios-unsigned.xcarchive.zip" TaleTrek.xcarchive
          ls -la ../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: taletrek-${{ env.VERSION }}-ios
          path: dist/*
          if-no-files-found: error

      - name: Attach to the GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/taletrek-${{ env.VERSION }}-ios.ipa
