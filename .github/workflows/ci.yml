name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # enables the manual-only `integration` job

jobs:
  # SPA / PWA — the existing gate, unchanged in behavior.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Rust workspace — synth + worker + desktop.
  # Blocks PRs. No real piper/ffmpeg (those are #[ignore]d; see `integration`).
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cpal links ALSA unconditionally on Linux (alsa-sys → pkg-config +
      # libasound2-dev); ubuntu-latest runners ship neither (reader T1).
      - name: Install build deps (cpal → ALSA)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Real-piper/ffmpeg integration tests. MANUAL ONLY (workflow_dispatch) and
  # never blocks PRs (continue-on-error). Runs the #[ignore]d e2e tests in
  # desktop/, which spin real binaries and assert Opus output.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
      - name: Configure paths
        run: |
          echo "TALETREK_PIPER_BIN=$RUNNER_TEMP/piper/piper" >> "$GITHUB_ENV"
          echo "TALETREK_VOICE_PATH=$RUNNER_TEMP/voices/en_US-hfc_female-medium.onnx" >> "$GITHUB_ENV"

      # libasound2-dev: the workspace --ignored compile pulls in desktop's
      # cpal. The device test itself still needs real audio hardware and is
      # expected to fail on runners — absorbed by continue-on-error (same
      # convention as the piper/ffmpeg ignored tests needing their env).
      - name: Install ffmpeg + ALSA dev
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev

      - name: Install piper (rhasspy TTS)
        run: |
          curl -fsSL -o /tmp/piper.tar.gz \
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf /tmp/piper.tar.gz -C "$RUNNER_TEMP"
          # tarball top-level dir is `piper/` → $RUNNER_TEMP/piper/piper (RUNPATH=$ORIGIN finds sibling .so)
          "$TALETREK_PIPER_BIN" --help >/dev/null && echo "piper OK"

      - name: Download voice model (.onnx + sibling .json)
        run: |
          mkdir -p "$(dirname "$TALETREK_VOICE_PATH")"
          base=https://huggingface.co/diffusionstudio/piper-voices/resolve/main/en/en_US/hfc_female/medium
          curl -fsSL -o "$TALETREK_VOICE_PATH" "$base/en_US-hfc_female-medium.onnx"
          # HF names the config `<voice>.onnx.json`; the e2e gate expects it saved as `<voice>.json`.
          curl -fsSL -o "${TALETREK_VOICE_PATH%.onnx}.json" "$base/en_US-hfc_female-medium.onnx.json"
          ls -la "$(dirname "$TALETREK_VOICE_PATH")"

      - name: Run #[ignore]d integration tests
        run: cargo test --workspace -- --ignored --nocapture

  # Android player app: kernel cross-build (.so via cargo-ndk) + Gradle
  # assemble + JVM unit tests + ktlint. NO EMULATOR by design — the
  # instrumented suites need real devices (`just android-instrumented`
  # runs locally on hardware; see docs/developing.md § Android).
  android:
    runs-on: ubuntu-latest
    # Fat-.so build (android-pipeline): the full dep graph cross-compiles
    # for two ABIs + the k2-fsa sherpa archive download (~45 MB) — 20 min
    # was tight; rust-cache still covers the target/ artifacts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Runner images ship an SDK, but the packages are pinned explicitly
      # for reproducibility (docs/developing.md § Android pins; NDK r28c is
      # also AGP 9's default). ANDROID_HOME is preset on the runner image.
      - name: Install pinned Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null

      # `just` ships on the ubuntu runner image; cargo-ndk is pinned via
      # --locked at the version the dev machines use (recorded in the
      # task-009 Outcome).
      - name: Install cargo-ndk (pinned)
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Cross-build the kernel (.so for both ABIs → jniLibs)
        run: just android-kernel

      - name: Assemble debug APK
        run: android/gradlew --project-dir android assembleDebug

      - name: JVM unit tests + ktlint
        run: android/gradlew --project-dir android testDebugUnitTest ktlintCheck

      # Bindings drift guard: regenerate the checked-in UniFFI Kotlin and
      # fail if it differs — cheap insurance for the checked-in-bindings
      # decision (the uniffi CLI version MUST match the crate dep exactly;
      # API checksums are verified at library load).
      - name: Bindings drift guard
        run: |
          cargo install uniffi --features cli --version 0.32.0 --locked
          just android-bindings
          git diff --exit-code -- android/app/src/main/java/dev/l1br3/taletrek/ffi/
