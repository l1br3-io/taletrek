name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # enables the manual-only `integration` job

jobs:
  # SPA / PWA — the existing gate, unchanged in behavior.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Rust workspace — synth + worker + desktop + server.
  # Blocks PRs. No real piper/ffmpeg (those are #[ignore]d; see `integration`).
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Server Docker image — catches Dockerfile / context drift cheaply.
  # Build only; never pushes. Mirrors the runbook's build command.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f server/Dockerfile -t taletrek-server:ci .

  # Real-piper/ffmpeg integration tests. MANUAL ONLY (workflow_dispatch) and
  # never blocks PRs (continue-on-error). Runs the #[ignore]d e2e tests in
  # desktop/ + server/, which spin real binaries and assert Opus output.
  # The Playwright SPA<->server suite (planned, Phase 3) will hook in here too.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    env:
      TALETREK_VOICE_PATH: ${{ runner.temp }}/voices/en_US-hfc_female-medium.onnx
      TALETREK_PIPER_BIN: ${{ runner.temp }}/piper/piper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install piper (rhasspy TTS)
        run: |
          curl -fsSL -o /tmp/piper.tar.gz \
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf /tmp/piper.tar.gz -C "$RUNNER_TEMP"
          # tarball top-level dir is `piper/` → $RUNNER_TEMP/piper/piper (RUNPATH=$ORIGIN finds sibling .so)
          "$TALETREK_PIPER_BIN" --help >/dev/null && echo "piper OK"

      - name: Download voice model (.onnx + sibling .json)
        run: |
          mkdir -p "$(dirname "$TALETREK_VOICE_PATH")"
          base=https://huggingface.co/diffusionstudio/piper-voices/resolve/main/en/en_US/hfc_female/medium
          curl -fsSL -o "$TALETREK_VOICE_PATH" "$base/en_US-hfc_female-medium.onnx"
          curl -fsSL -o "${TALETREK_VOICE_PATH%.onnx}.json" "$base/en_US-hfc_female-medium.json"
          ls -la "$(dirname "$TALETREK_VOICE_PATH")"

      - name: Run #[ignore]d integration tests
        run: cargo test --workspace -- --ignored --nocapture
