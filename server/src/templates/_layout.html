<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TaleTrek{% endblock %}</title>
{#
  Inline CSS only — no external assets, no CDN, no JS. The whole operator panel
  is self-contained markup so it works offline / behind a firewall with one
  round-trip. A muted, system-font palette; deliberately not a framework look.
#}
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1d2230;
    --ink: #e6e9ef;
    --ink-dim: #9aa3b2;
    --accent: #7cc4ff;
    --ok: #8fd6a0;
    --warn: #f0c674;
    --bad: #e88b8b;
    --line: #2a3142;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 1.25rem 1.25rem 4rem;
    max-width: 920px;
    margin: 0 auto;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.25rem; }
  header .brand { font-weight: 600; font-size: 1.05rem; letter-spacing: .02em; }
  header .brand .mark { color: var(--accent); }
  nav a { color: var(--ink-dim); margin-right: .9rem; font-size: .9rem; }
  h1 { font-size: 1.15rem; margin: 1.5rem 0 .6rem; font-weight: 600; }
  h2 { font-size: .95rem; margin: 1.4rem 0 .5rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .06em; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .45rem .55rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--ink-dim); font-weight: 500; font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; }
  td.actions { text-align: right; white-space: nowrap; }
  .badge { font-size: .75rem; padding: .12rem .45rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim); }
  .badge.audio { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .badge.text-only { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .status { font-size: .78rem; }
  .status.succeeded { color: var(--ok); }
  .status.running { color: var(--accent); }
  .status.failed { color: var(--bad); }
  .status.queued { color: var(--ink-dim); }
  .dim { color: var(--ink-dim); }
  .err { color: var(--bad); font-size: .82rem; }
  form.inline { display: inline; }
  form.upload { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .25rem 0; }
  label { color: var(--ink-dim); font-size: .85rem; }
  input, select, button, .button {
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
    padding: .4rem .6rem; font: inherit;
  }
  input[type="file"] { padding: .3rem; }
  button, .button { cursor: pointer; border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  button:hover, .button:hover { border-color: var(--accent); }
  button.danger { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); color: var(--bad); }
  button.danger:hover { border-color: var(--bad); }
  .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .muted-note { color: var(--ink-dim); font-size: .82rem; margin-top: .5rem; }
  .flash-err { background: color-mix(in srgb, var(--bad) 14%, var(--panel)); border:1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); border-radius:6px; padding:.6rem .8rem; margin-bottom:.8rem; }
  dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .8rem; margin: 0 0 .6rem; }
  dl.meta dt { color: var(--ink-dim); font-size: .82rem; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">❯~</span> TaleTrek</div>
  <nav>
    <a href="/">Library</a>
    <a href="/ui/jobs">Jobs</a>
  </nav>
</header>
{% block content %}{% endblock %}
</body>
</html>
