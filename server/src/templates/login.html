{% extends "_layout.html" %}
{% block title %}Sign in — TaleTrek{% endblock %}
{% block content %}

<h1>Sign in</h1>

<section>
  {% if let Some(m) = error %}
    <div class="flash-err">{{ m }}</div>
  {% endif %}
  <form action="/ui/login" method="post">
    <div class="row">
      <label for="token">Token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </div>
  </form>
  <p class="muted-note">Enter the server's <span class="mono">TALETREK_TOKEN</span>. Sets a cookie; the API still accepts <span class="mono">Authorization: Bearer</span>.</p>
</section>

{% endblock %}
