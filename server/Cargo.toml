[package]
name = "taletrek-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "TaleTrek personal server — a self-hosted, Docker-first library server for .taletrek bundles."

[[bin]]
name = "taletrek-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
rusqlite = { version = "0.35", features = ["bundled"] }
askama = "0.12"
taletrek-synth = { path = "../crates/synth" }
taletrek-worker = { path = "../crates/worker" }

[dev-dependencies]
tempfile = "3"
# `ServiceExt::oneshot` for router-level handler/middleware tests (T7+).
tower = { version = "0.5", features = ["util"] }
# HTTP client for the `#[ignore]`d binary-subprocess e2e (T12). Already in the
# workspace dep graph via `taletrek-worker` (voice downloads), so this adds no
# new vendor tree. Chosen over `reqwest` for the same minimal-footprint reason
# (ADR-0013). Mirrors desktop's `tests/synth_e2e.rs` gate.
ureq = "3"

[lints]
workspace = true
